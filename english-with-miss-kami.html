<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business English A2–B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
  --brand:#db2777; --brand2:#06b6d4; --ok:#16a34a; --bad:#dc2626;
  --s:#2563eb; --v:#dc2626; --o:#16a34a; --t:#7c3aed; --x:#ea580c;
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header.top{background:radial-gradient(900px 420px at 85% 10%,rgba(236,72,153,.35),transparent 60%),radial-gradient(700px 400px at 5% 100%,rgba(168,85,247,.35),transparent 60%),linear-gradient(135deg,#0d0717,#1c0b2b 55%,#2a0d33);color:#fff;padding:44px 0 84px;position:relative;overflow:hidden}
.herogrid{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}
@media(max-width:760px){.herogrid{grid-template-columns:1fr}.mono{display:none!important}}
.brandtag{display:inline-flex;align-items:center;gap:8px;font:800 12px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#f9a8d4;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.4);padding:6px 14px;border-radius:99px;margin-bottom:18px}
h1.brand{font-family:Montserrat,sans-serif;font-weight:900;line-height:.95;margin:0 0 16px;letter-spacing:-1px}
h1.brand .bw{display:block;font-size:clamp(22px,3.6vw,34px);letter-spacing:6px;color:#fff;opacity:.92;font-weight:800}
h1.brand .bk{display:block;font-size:clamp(46px,9vw,92px);background:linear-gradient(90deg,#ff7ac6,#ec4899 40%,#c084fc 80%,#ff7ac6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 6px 30px rgba(236,72,153,.45))}
@keyframes shine{to{background-position:200% center}}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 4px}
.phone{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#ec4899,#a855f7);padding:10px 20px 10px 10px;border-radius:99px;box-shadow:0 10px 30px rgba(236,72,153,.45);transition:.2s}
.phone:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(236,72,153,.6)}
.phone .pi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}65%,75%,85%{transform:rotate(-14deg)}70%,80%,90%{transform:rotate(14deg)}}
.phone small{display:block;font:700 10px Montserrat,sans-serif;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.phone b{display:block;font:800 19px Montserrat,sans-serif;letter-spacing:.5px}
.copyb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:10px 16px;font-weight:800}
.copyb:hover{background:rgba(255,255,255,.16)}
.mono{position:relative;width:230px;height:230px;display:grid;place-items:center}
.mono svg.ringtxt{position:absolute;inset:0;animation:aspin 18s linear infinite}
.mono .core{width:140px;height:140px;border-radius:50%;background:linear-gradient(145deg,#ec4899,#7c3aed);display:grid;place-items:center;font:900 52px Montserrat,sans-serif;color:#fff;box-shadow:0 0 0 8px rgba(236,72,153,.15),0 20px 60px rgba(236,72,153,.5);animation:afloat 4s ease-in-out infinite}
.spark{position:absolute;color:#f9a8d4;animation:apulse 2s ease-in-out infinite}
.btag{display:inline-block;font:800 11px Montserrat,sans-serif;letter-spacing:2px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:99px;margin-left:8px}
.btag i{font-style:normal;color:#fbcfe8}
.fcard{background:linear-gradient(135deg,#0d0717,#2a0d33);color:#fff;border-radius:24px;padding:26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin:0 0 30px;position:relative;overflow:hidden}
.fcard:before{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-120px;background:radial-gradient(circle,rgba(236,72,153,.45),transparent 65%)}
.fcard .fb1{font:900 24px Montserrat,sans-serif;position:relative}
.fcard .fb1 span{color:#f472b6}
.fcard p{margin:4px 0 0;opacity:.75;position:relative}
.fab{position:fixed;right:18px;bottom:18px;z-index:40;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(236,72,153,.55);text-decoration:none}
.fab:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #f472b6;animation:pulsering 2s ease-out infinite}
@keyframes pulsering{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
header.top h1{font-size:clamp(28px,5vw,46px);margin:0 0 6px;font-weight:900;letter-spacing:-.5px}
header.top p{margin:0;opacity:.9;font-size:17px;max-width:680px}
.lvl{display:inline-flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:99px;font-weight:800;font-size:13px}
.bubbles span{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:floaty 9s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-22px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:-46px;position:relative}
.tcard{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(30,41,59,.06);text-align:left;transition:.2s;display:flex;flex-direction:column;gap:6px}
.tcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(79,70,229,.18)}
.tcard .em{font-size:34px}
.tcard .n{font-size:12px;font-weight:800;color:var(--muted)}
.tcard b{font-size:16px;line-height:1.25}
.tcard small{color:var(--muted);font-size:13px}
.tcard .g{font-size:12px;font-weight:800;color:var(--brand);background:#eef2ff;border-radius:8px;padding:2px 8px;align-self:flex-start}
.howto{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:22px 0 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.howto div{font-size:14px}.howto b{display:block;font-size:15px}

/* topic view */
.tophead{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;padding:22px 0 18px}
.back{background:rgba(255,255,255,.2);border:0;color:#fff;padding:6px 14px;border-radius:99px;font-weight:800}
.tophead h2{margin:10px 0 2px;font-size:clamp(24px,4vw,36px);font-weight:900}
.tophead .kz{opacity:.9}
.tabs{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:800;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav2{display:flex;justify-content:space-between;margin:30px 0 50px;gap:10px}
.nav2 button{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:800}
section.pane{display:none;padding:22px 0}
section.pane.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.h3{font-size:22px;font-weight:900;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.spk{width:34px;height:34px;border-radius:50%;border:0;background:#eef2ff;color:var(--brand);font-size:16px;flex:none;display:inline-grid;place-items:center}
.spk:hover{background:var(--brand);color:#fff}
.spk.slow{background:#ecfeff;color:#0891b2}
.spk.slow:hover{background:#0891b2;color:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}

/* speaking */
.qlist{display:grid;gap:10px;counter-reset:q}
.q{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:.2s}
.q.hl{border-color:var(--brand);box-shadow:0 0 0 4px #e0e7ff;transform:scale(1.01)}
.q .num{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.q p{margin:0;flex:1;font-weight:700}
.timerbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.clock{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:70px}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bank .col h4{margin:0 0 8px;display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:900;padding:2px 9px;border-radius:99px;color:#fff}
.chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;margin-bottom:6px;border:1px solid var(--line);background:#fff}
.chip label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.chip input{width:18px;height:18px;accent-color:var(--ok)}
.chip .w{font-weight:800}.chip .k{color:var(--muted);font-size:13px}
.chip.done{background:#f0fdf4;border-color:#86efac}
.chip.done .w{text-decoration:line-through;text-decoration-color:var(--ok)}

/* vocab */
.vtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.vcard:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lv)}
.vcard .top{display:flex;align-items:center;gap:6px}
.vcard .word{font-size:20px;font-weight:900;flex:1}
.vcard .ipa{font-family:"Segoe UI",Arial,sans-serif;color:#0891b2;font-size:15px}
.vcard .tr{font-weight:700;color:#334155;transition:.2s}
.hideTr .vcard .tr{filter:blur(6px);cursor:pointer}
.hideTr .vcard .tr.show{filter:none}
.vcard .ex{font-size:14px;color:var(--muted);font-style:italic;display:flex;gap:6px;align-items:flex-start}
.vcard .ex .spk{width:26px;height:26px;font-size:12px}
.lvhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.lvhead .big{font-size:26px;font-weight:900;color:#fff;padding:2px 14px;border-radius:12px}

/* reading */
.rtext{font-size:18px;line-height:1.85;max-width:780px}
.rtext p{margin:0 0 16px}
.rtext .wd{cursor:pointer;border-radius:4px;transition:background .15s;padding:0 1px}
.rtext .wd:hover{background:#e0e7ff}
.rtext .wd.mk{background:#fde047;box-shadow:0 2px 0 #eab308}
.rtext .wd.reading{background:#bae6fd}
.rinfo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.mylist{display:grid;gap:8px}
.myrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:6px 10px}
.myrow b{min-width:90px}
.myrow input{border:1px solid #fde68a;border-radius:8px;padding:6px 8px;font-family:inherit;font-size:14px;width:100%;background:#fff}
.myrow .x{border:0;background:none;color:var(--bad);font-size:18px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;resize:vertical}
.proc{position:relative;background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:22px;padding:26px 18px 30px;color:#fff;overflow:hidden}
.proc h4{margin:0 0 4px;font-size:20px}
.proc .ps{opacity:.7;margin:0 0 20px;font-size:14px}
.steps{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center}
.step{width:132px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 8px;text-align:center;opacity:0;transform:translateY(20px) scale(.9);transition:all .5s cubic-bezier(.2,.9,.3,1.3)}
.step.in{opacity:1;transform:none}
.step.act{background:linear-gradient(160deg,var(--c1),var(--c2));border-color:transparent;transform:scale(1.07);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.step .se{font-size:40px;display:block;transition:.4s}
.step.act .se{animation:hop .8s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-8px) rotate(-6deg)}}
.step .sl{font-size:13px;font-weight:800;line-height:1.3;display:block;margin-top:6px}
.step .sn{font-size:11px;opacity:.6;font-weight:900}
.arrow{align-self:center;font-size:22px;opacity:0;transition:.4s;color:#67e8f9}
.arrow.in{opacity:1;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.pcap{text-align:center;margin-top:18px;min-height:26px;font-weight:700;color:#a5f3fc}

/* grammar */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend span{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;color:#fff}
.c-s{color:var(--s)}.c-v{color:var(--v)}.c-o{color:var(--o)}.c-t{color:var(--t)}.c-x{color:var(--x)}
.b-s{background:var(--s)}.b-v{background:var(--v)}.b-o{background:var(--o)}.b-t{background:var(--t)}.b-x{background:var(--x)}.b-n{background:#64748b}
.mk-s,.mk-v,.mk-o,.mk-t,.mk-x{font-weight:800;border-bottom:3px solid;padding:0 2px}
.mk-s{color:var(--s)}.mk-v{color:var(--v)}.mk-o{color:var(--o)}.mk-t{color:var(--t)}.mk-x{color:var(--x)}
.gintro{font-size:17px;background:linear-gradient(120deg,#eef2ff,#ecfeff);border-radius:var(--r);padding:18px;border:1px solid #c7d2fe;margin-bottom:16px}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
.formula .lab{font-weight:900;min-width:110px;font-size:14px;color:var(--muted)}
.blk{color:#fff;font-weight:800;padding:8px 14px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.15);opacity:0;transform:translateY(-14px);animation:drop .5s forwards}
.plus{font-weight:900;color:var(--muted);opacity:0;animation:drop .4s forwards}
@keyframes drop{to{opacity:1;transform:none}}
.gvis{background:#fff;border:2px dashed #c7d2fe;border-radius:var(--r);padding:18px;margin-bottom:16px;overflow-x:auto}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:10px 14px}
.exs{display:grid;gap:10px}
.ex{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ex .en{font-size:18px}.ex .kzt{font-size:14px;color:var(--muted)}
.mist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow .w{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;text-decoration:line-through;text-decoration-color:#f87171}
.mrow .r{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 12px;font-weight:700}
.mrow .why{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-4px;padding-left:4px}
@media(max-width:600px){.mrow{grid-template-columns:1fr}}
/* timeline helpers used in grammar visuals */
.tl{position:relative;height:120px;margin:10px 8px 4px;min-width:520px}
.tl .line{position:absolute;left:0;right:0;top:60px;height:4px;background:#cbd5e1;border-radius:2px}
.tl .line:after{content:"";position:absolute;right:-4px;top:-6px;border-left:12px solid #cbd5e1;border-top:8px solid transparent;border-bottom:8px solid transparent}
.tl .mark{position:absolute;top:40px;transform:translateX(-50%);text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.tl .mark i{display:block;width:4px;height:44px;margin:0 auto 4px;background:#94a3b8;border-radius:2px}
.tl .dot{position:absolute;top:50px;width:24px;height:24px;border-radius:50%;transform:translateX(-50%);animation:pop 1.6s infinite}
.tl .bar{position:absolute;top:52px;height:20px;border-radius:10px;transform-origin:left;animation:grow 2.4s ease-in-out infinite}
.tl .lbl{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:800;white-space:nowrap;padding:3px 9px;border-radius:9px;color:#fff}
@keyframes pop{50%{transform:translateX(-50%) scale(1.3)}}
@keyframes grow{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
.vt{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;min-width:460px}
.vt th{background:var(--ink);color:#fff;padding:9px 10px;text-align:left}
.vt th:first-child{border-radius:10px 0 0 0}.vt th:last-child{border-radius:0 10px 0 0}
.vt td{padding:9px 10px;border-bottom:1px solid var(--line)}
.vt tr:nth-child(even) td{background:#f8fafc}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.fbox{border-radius:14px;padding:12px 14px;font-weight:800;text-align:center;color:#fff;min-width:120px}
.farrow{font-size:24px;color:var(--muted);font-weight:900}
.scale{display:flex;align-items:flex-end;gap:8px;justify-content:center;min-height:160px}
.scale div{width:86px;border-radius:12px 12px 4px 4px;color:#fff;font-weight:800;text-align:center;padding:8px 4px;font-size:13px;transform-origin:bottom;animation:rise 1s ease-out both}
@keyframes rise{from{transform:scaleY(0)}}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.twocol{grid-template-columns:1fr}}
.panel{border-radius:16px;padding:14px;border:2px solid}
.panel h5{margin:0 0 6px;font-size:17px}

/* homework */
.hwnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.hwnav a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--ink)}
.scene{position:relative;height:330px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfdbfe,#e0f2fe 60%,#d9f99d 60%,#bbf7d0);border:1px solid var(--line);margin-bottom:12px}
.scene .it{position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1}
.scene .it small{display:block;font-size:11px;font-weight:800;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 5px;margin-top:3px;white-space:nowrap}
.a-float{animation:afloat 3s ease-in-out infinite}
.a-bounce{animation:abounce 1.2s ease-in-out infinite}
.a-spin{animation:aspin 4s linear infinite}
.a-slide{animation:aslide 6s ease-in-out infinite}
.a-pulse{animation:apulse 1.6s ease-in-out infinite}
.a-shake{animation:ashake .9s ease-in-out infinite}
.a-fly{animation:afly 8s linear infinite}
@keyframes afloat{50%{margin-top:-14px}}
@keyframes abounce{50%{margin-top:-24px}}
@keyframes aspin{to{rotate:360deg}}
@keyframes aslide{50%{margin-left:90px}}
@keyframes apulse{50%{scale:1.25}}
@keyframes ashake{25%{rotate:-10deg}75%{rotate:10deg}}
@keyframes afly{0%{margin-left:-60%}100%{margin-left:60%}}
.prompts{display:grid;gap:6px;margin:0 0 12px;padding-left:20px}
.wc{font-size:13px;color:var(--muted);text-align:right}
.quiz .qq{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.quiz .qq p{margin:0 0 10px;font-weight:700;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-weight:800;text-align:left;font-size:15px;color:var(--ink)}
.opt:hover{border-color:#a5b4fc}
.opt.right{background:#dcfce7;border-color:var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);animation:ashake .4s 1}

reading:{title:"How a Small Business Grows",text:`Two years ago, Aliya was a university student with a simple dream: she wanted to run her own business. Like many young people in Almaty, she loved coffee, but she noticed a problem. The cafés near her university were expensive, and in the morning students had to wait in long queues. Aliya saw an opportunity.

First, she did some research. She asked her classmates how much they usually paid for coffee and what they wanted. Most of them said they needed something fast, cheap and good. Then she wrote a simple business plan. It explained who her customers were, what she was going to sell, how much everything would cost and how she could make a profit.

The next step was money. A business needs capital to start, and Aliya did not have much. She borrowed some money from her parents and used her own savings. With this money, she rented a small kiosk next to the university gate and bought a second-hand coffee machine.

On the first day, only fifteen customers came. Aliya was disappointed, but she did not give up. She started an Instagram page, offered a student discount and gave a free cookie with every second coffee. Soon, word of mouth did the rest: students told their friends, and the queue moved from the expensive cafés to her kiosk.

After six months, the kiosk earned enough revenue to pay for rent, coffee beans and the salary of one part-time assistant. For the first time, Aliya's business made a real profit. She did not spend it. Instead, she reinvested it and opened a second kiosk near the business centre.

Aliya's story shows the basic idea of any business. A business finds a need, offers a product or service, and sells it for more than it costs to produce. The difference between revenue and costs is profit. However, profit is not only about numbers. Reliable service, a friendly owner and loyal customers are often the real reasons why a small business survives and grows.`,

reading:{title:"From a Garage to the World",text:`Many famous companies began in very small places. Amazon started in a garage, and Apple was founded in a family house in California. Our story is about a smaller company, but its path is similar.

In 2010, two friends, Timur and Asel, started making leather bags in Timur's garage. They had very little money, only two sewing machines and a lot of enthusiasm. At first, they sold their bags to friends and neighbours. People liked the quality, and soon strangers began to call and ask for orders.

In 2013, they opened their first shop in the city centre and hired five employees. Sales grew quickly. Two years later, they created an online store, and this changed everything. Customers from other cities, and later from other countries, started buying their bags. In 2018, the company opened branches in Astana and Shymkent and moved its headquarters to a modern office building.

The biggest step came in 2021, when the company joined a merger with a Turkish producer. The merger gave them new factories, new technology and access to European markets. That year, revenue doubled.

Since then, the company has changed a lot. It has expanded into twelve countries and has launched three new product lines: backpacks, wallets and travel bags. It has also won several international design awards. Today, the company has more than 400 employees, and its brand is recognised in many airports and shopping malls.

However, growth has also brought problems. Some old customers say that the bags have become too expensive and that the company has lost its "family feeling". The founders have heard this criticism. They have recently opened a small workshop where customers can watch craftsmen make bags by hand, just like in the old garage.

Timur often says that the company's history is its most important asset. "We have grown, but we have not forgotten where we started," he explains. For him, success is not only about size. It is about keeping the original idea alive while the business keeps changing.`,

grammar:{name:"Present Perfect vs Past Simple",
intro:"Екеуі де өткен оқиғаны айтады, бірақ: <b>Past Simple</b> — <u>нақты, аяқталған уақыт</u> (yesterday, in 2010, last year, ago). <b>Present Perfect</b> — уақыт айтылмайды, <u>нәтижесі ҚАЗІР маңызды</u> (ever, never, already, yet, just, since, for).§Оба времени говорят о прошлом, но: <b>Past Simple</b> — <u>конкретное, законченное время</u> (yesterday, in 2010, last year, ago). <b>Present Perfect</b> — время не указано, <u>важен результат СЕЙЧАС</u> (ever, never, already, yet, just, since, for).",

{label:"Present Perfect",parts:[["Subject","s"],["have / has","v"],["V3 (worked, gone)","v"],["Object","o"]]},

reading:{title:"Dana's Startup Plan",text:`Dana is twenty-three, and she is going to start her own company next spring. Her idea is simple: a mobile app that connects students with local tutors in just a few minutes. She noticed the problem herself. Last year, she needed a maths tutor, but it took her two weeks to find a good one.

Before she writes a single line of code, Dana is doing research. She has interviewed more than a hundred students and thirty tutors. The results are clear: students want cheap and fast help, and tutors want more clients without paying for expensive advertising. This is the gap in the market that her startup is going to fill.

Next month, Dana and her partner, a young programmer called Arman, are going to build a prototype. It will not be perfect, but it will show the main features: searching for a tutor, booking a lesson and paying online. They are going to test it with fifty students and collect feedback. "We will probably change many things after the test," Dana admits. "That's normal. A startup must learn quickly."

The biggest challenge is funding. Dana has prepared a business plan with a budget and a three-year sales forecast. She is meeting two investors next Thursday at a startup event in Astana. She has only five minutes for her pitch, so she is practising every evening. In her pitch, she will explain the problem, the solution, the size of the market and how the company is going to make money: it will take a ten per cent commission from every lesson.

Dana knows that most startups fail. Some run out of money, some build products that nobody wants, and some teams break up. To reduce the risk, she is going to start in one city only. If the app works well there, the company will scale up to other cities and later to other countries.

"I don't think it will be easy," Dana says, "but I'm sure we'll learn a lot. Even if we fail, the experience will help me in the future."`,

reading:{title:"The Coffee War on Abay Street",text:`For five years, "Bean House" was the only café on Abay Street. It was not the cheapest place in town, but it was the most convenient one for the office workers nearby. The owner did not worry about competition because he had no competitors. Prices slowly went up, and the service became slower.

Then, one spring morning, a new café called "Quick Cup" opened across the street. Its coffee was much cheaper, and it offered a mobile app for ordering. In the first month, Bean House lost almost a third of its customers. This is a classic example of what economists call market competition: when a new company enters a market, the old company has to react.

At first, Bean House reduced its prices. Quick Cup answered by reducing its prices even more. This kind of situation is called a price war. Customers were happy, but both cafés were losing money. A price war is rarely the best strategy, because the company with less money usually loses first.

So Bean House changed its strategy. Instead of being the cheapest, it decided to be the most comfortable. It added soft chairs, faster Wi-Fi and fresh pastries baked every morning. It also created a loyalty card: the tenth coffee became free. Quick Cup, on the other hand, focused on speed. Its baristas could serve a customer in less than a minute, which was much faster than any other café in the area.

A year later, the street looked very different. Bean House had about 55 per cent of the market share, and Quick Cup had 45 per cent. Both cafés were making a profit, but they served different customers. Students and busy workers preferred Quick Cup because it was faster and cheaper. Freelancers and people who had meetings preferred Bean House because it was quieter and more comfortable.

The real winners were the consumers. They had more choice, better quality and fairer prices than before. This is why most economists believe that competition is healthier than a monopoly. When companies compete, they have to become more efficient, more creative and more customer-friendly.`,

reading:{title:"The Four Jobs of a Manager",text:`Many people think that a manager's job is simply to give orders. In reality, management is much more complex. More than a hundred years ago, the French engineer Henri Fayol described the main functions of management. Today, business schools usually reduce them to four: planning, organising, leading and controlling.

The first function is planning. A manager has to decide what the team must achieve and how. For example, the manager of a sales department may set a goal to increase sales by fifteen per cent next year. Then she must choose the best way to reach this goal: new customers, new products or better advertising.

The second function is organising. A plan is useless if nobody knows who does what. The manager has to divide the work into tasks, give each task to the right person and make sure the team has the necessary resources: money, equipment, information and time. Good managers delegate. They do not try to do everything themselves.

The third function is leading. People are not machines, and they work better when they feel motivated. A manager should communicate clearly, listen to employees and give regular feedback. Research shows that praise and recognition often motivate people as much as money does. A manager mustn't humiliate workers in front of others, because this destroys trust in the team.

The fourth function is controlling. The manager has to check whether the team is moving towards the goal. This is done with reports, performance indicators and regular meetings. If sales are lower than planned, the manager has to find out why and change something. Controlling does not mean watching every step of every employee. Employees don't have to report every small action; they have to deliver results.

These four functions form a cycle. After controlling, the manager uses the results to make a better plan, and the cycle starts again. In small companies, one person often does all four jobs. In big corporations, there are many levels of managers, from team leaders to the CEO. But at every level, the basic job is the same: to achieve goals through other people.`,

reading:{title:"The Journey of a T-shirt",text:`Look at the label on your T-shirt. Where was it made? Probably in Bangladesh, China, Vietnam or Turkey. But the story of a simple T-shirt is much longer than one country. It is a good example of a global supply chain.

First, cotton is grown. A lot of the world's cotton is produced in India, the USA and Uzbekistan. The cotton is picked, cleaned and pressed into large bales. These raw materials are then sold to a spinning factory, where the cotton is turned into thread.

Next, the thread is sent to a textile factory. There, it is knitted into fabric, and the fabric is dyed in different colours. This stage uses huge amounts of water and chemicals, so it is often criticised by environmental groups.

After that, the fabric is shipped to a garment factory. Here, the pieces are cut and the T-shirts are sewn by workers, mostly women. In modern factories, some steps are automated, but sewing is still usually done by hand. Before the T-shirts leave the factory, they are checked by quality control. Shirts with mistakes are rejected.

The finished T-shirts are packed in boxes and loaded into containers. The containers are carried by ship to Europe or Asia, which can take four to six weeks. When the shipment arrives at a port, it is transported by truck to a warehouse. From the warehouse, the products are distributed to shops or delivered directly to customers who have ordered online.

Each step of this chain is managed by different companies. If one link is broken, for example when a port is closed, the whole chain is delayed. This happened during the COVID-19 pandemic, when many goods were not delivered on time and prices went up.

Today, more and more customers want to know how their clothes are made. Some brands now publish the names of their suppliers, and new technologies like QR codes allow buyers to follow a product's journey from the field to the shop. Logistics is no longer an invisible part of business; it is becoming part of the brand.`,

reading:{title:"The Marketing Funnel",text:`Why do you buy one brand of shampoo and not another? The answer is usually marketing. Marketing is not only advertising; it is the whole process of understanding customers and guiding them from "I have never heard of this product" to "I will buy it again". Marketers often describe this process as a funnel.

At the top of the funnel is awareness. If people don't know about your product, they won't buy it. Companies create awareness with adverts, posters, social media posts and influencers. The goal is to reach as many people from the target audience as possible. For example, a new energy drink may sponsor a student festival, because students are its target market.

The next stage is interest. Most people see hundreds of adverts every day, so a brand must be memorable. A clever slogan, a funny video or an eye-catching design can make people stop and look. If the content is useful or entertaining, people will follow the brand and want to learn more.

Then comes consideration. Here, customers compare products, read reviews and ask friends. Word of mouth is extremely powerful at this stage. If a friend recommends a product, you will probably trust her more than any advert. That is why many companies ask happy customers to leave reviews.

After that, the customer reaches the decision stage. A small push can help: a discount, free delivery or a limited offer. Marketers measure how many people actually buy; this is called the conversion rate. If the conversion rate is low, the company will need to change something, perhaps the price or the website.

The final stage is loyalty. Getting a new customer usually costs five times more than keeping an old one. So companies use loyalty programmes, personal emails and excellent service. If customers are happy, they will come back and tell their friends, and the funnel starts again.

Of course, marketing has a dark side. Some adverts are misleading, and some companies collect too much personal data. If brands lose customers' trust, no campaign will save them. The best marketing is still a good product and an honest message.`,

reading:{title:"The 50/30/20 Rule",text:`Many young people get their first salary and are surprised how quickly it disappears. Rent, food, transport, a new phone, coffee with friends, and suddenly the month is longer than the money. Financial experts say that the problem is usually not low income but the lack of a plan.

One of the simplest plans is the 50/30/20 rule. It was made popular by the American politician Elizabeth Warren. The idea is to divide your income after tax into three parts. Fifty per cent goes to needs: things you must pay for, like rent, food, transport and bills. Thirty per cent goes to wants: things you enjoy but could live without, like eating out, clothes, games or travel. Finally, twenty per cent goes to savings or to paying back debt.

Let's look at an example. Aigerim earns 400,000 tenge a month. If she followed the rule, she would spend 200,000 tenge on needs and 120,000 on wants, and she would save 80,000. After one year, she would have almost a million tenge in savings, even without any interest.

Of course, life is not always so simple. If Aigerim lived in a very expensive city, her needs would probably take more than half of her income. In that case, she would have to cut her wants. Experts say that the exact numbers are less important than the habit. You should pay yourself first, which means you put money into savings at the start of the month, not at the end.

Another important lesson is about debt. Credit cards and quick loans make it very easy to buy things you cannot afford. But the interest can be extremely high. If you borrowed 100,000 tenge at 40 per cent a year and paid only the minimum, you would pay back much more than you borrowed.

So what would happen if everybody followed a simple budget? Economists believe that people would feel less stress, families would have an emergency fund, and fewer people would fall into debt. Money cannot buy happiness, as the saying goes, but a good plan can certainly buy peace of mind.`,

reading:{title:"Three Styles of Leadership",text:`What makes a good leader? For decades, researchers have tried to answer this question. In the 1930s, the psychologist Kurt Lewin described three basic leadership styles, which are still discussed in business schools today: autocratic, democratic and laissez-faire.

An autocratic leader is a person who makes decisions alone. He or she tells the team what to do and expects people to follow the instructions without questions. This style can work in a crisis, when there is no time for long discussions, or in places like the army or a hospital emergency room, where mistakes can be dangerous. However, employees who work under autocratic leaders often feel unmotivated, because nobody asks for their opinion.

A democratic leader, on the other hand, is someone who involves the team in decisions. She listens to ideas, discusses options and then makes the final choice. Research shows that teams which have democratic leaders are often more creative and more satisfied. The disadvantage is that decisions take longer. A democratic leader must also be decisive enough to stop the discussion when it is time to act.

The third style is laissez-faire, a French expression that means "let them do". A laissez-faire leader gives the team almost complete freedom. This style works well with experienced professionals whose skills are very high, for example a group of senior scientists or designers. But with a new or inexperienced team, it often leads to chaos, missed deadlines and conflict.

Modern experts believe that the best leaders are those who can change their style depending on the situation. This idea is called situational leadership. A manager whose team is new might start with a more directive style and slowly give more freedom as people become more confident.

There are also qualities that all good leaders seem to share, whatever their style. They have a clear vision that they can explain simply. They are honest, they show empathy, and they set an example. As one famous saying goes: a boss says "Go!", but a leader says "Let's go!"`,

reading:{title:"How to Survive a Job Interview",text:`For many young people, a job interview is one of the most stressful experiences in life. You want to make a good impression, but you are afraid of saying something wrong. The good news is that interviewing is a skill, and like any skill, it can be learned.

The first step is preparing. Recruiters expect candidates to know something about the company. Before the interview, spend some time reading the company's website and news. Try to understand what the company does, who its customers are and what problems it may have. If you mention this information during the interview, you will show real interest.

Next, practise answering typical questions. Almost every interviewer asks you to tell them about yourself. Avoid repeating your whole CV. Instead, prepare a short story of about one minute: your studies, your experience and why you want to work in this field. Another classic question is about your strengths and weaknesses. Don't pretend to have no weaknesses. It is better to admit a real weakness and explain how you are trying to improve it, for example: "I used to find speaking in public difficult, so I decided to join a debate club."

On the day of the interview, plan to arrive ten minutes early. Being late is one of the worst mistakes you can make. Dress a little more formally than the company's normal style, switch off your phone and remember to smile. Body language matters: keep eye contact, sit straight and avoid crossing your arms.

During the interview, listen carefully and don't be afraid of asking for clarification if you don't understand a question. Use concrete examples. Instead of saying "I am good at teamwork", describe a project where you managed to solve a problem with your team.

At the end, the interviewer will usually ask if you have any questions. Always have two or three ready. Asking about the team or opportunities for training shows that you are thinking about your future in the company. Finally, after the interview, consider sending a short thank-you email. Many candidates forget to do it, so it can help you stand out.`,

reading:{title:"Why Most Meetings Fail",text:`Studies show that managers spend up to half of their working time in meetings, and many of them say that most meetings are a waste of time. So what goes wrong, and how can meetings become more productive?

Last month, the HR manager of a large company in Almaty decided to investigate. She asked fifty employees about their meetings. Many of them said that meetings were too long and had no clear goal. One engineer told her that he had attended a two-hour meeting where nobody made a single decision. A designer said that she often checked her email during meetings because the discussion had nothing to do with her work. Another employee complained that the same people always talked while the others were afraid to speak.

Based on these answers, the manager introduced four simple rules.

First, every meeting must have an agenda. The organiser sends it at least a day before, so people know what will be discussed and can prepare. If there is no agenda, there is no meeting.

Second, only the people who are really needed are invited. Others can read the minutes later. The manager said that this rule alone had reduced the number of people in meetings by forty per cent.

Third, someone leads the meeting and controls the time. This person makes sure that everyone has a chance to give their point of view, and politely stops people who interrupt or talk too much. Useful phrases like "Sorry to interrupt, but…", "Could we come back to the agenda?" and "Let me summarise" help to keep the discussion on track.

Fourth, every meeting ends with action points: who will do what and by when. The next day, the minutes are sent to all participants as a follow-up.

Three months later, the manager asked the employees again. Most of them said that meetings had become shorter and more useful. One team leader told her that his team now had half as many meetings but made decisions twice as fast. However, a few people admitted that they missed the long meetings, because they had been a good chance to chat with colleagues. The company has now started a weekly coffee break for that.`,

reading:{title:"The Invisible Hand: Supply and Demand",text:`Why does a cup of coffee cost more at the airport than in the city? Why are tomatoes cheap in August but expensive in February? The answer to both questions is one of the most important ideas in economics: supply and demand.

Demand is the amount of a product that people want to buy at a certain price. In general, when the price goes up, demand goes down, because fewer people can afford the product. Supply is the amount of a product that sellers want to sell. When the price goes up, supply usually increases, since producers can earn more money.

The point where the two lines meet on a graph is called the equilibrium price. At this price, the amount that people want to buy is equal to the amount that sellers want to sell. However, this balance changes all the time.

Let's take tomatoes as an example. In summer, farmers in Kazakhstan grow a lot of tomatoes. Supply is high; therefore, prices are low. In winter, however, tomatoes have to be grown in greenhouses or imported from other countries. As a result, supply falls and prices rise, although people want to eat tomatoes just as much as before.

Demand can also change suddenly. In 2020, at the beginning of the pandemic, demand for face masks and hand sanitiser increased dramatically. Since factories could not produce them fast enough, there was a shortage, and prices went up five or even ten times. A few months later, many new producers had entered the market. Consequently, there was a surplus, and prices fell again.

The airport coffee is a slightly different case. Passengers cannot easily go somewhere else, so the café faces less competition. Moreover, the rent at an airport is very high. Even though the coffee is the same, the price is higher.

The Scottish economist Adam Smith described this system as an "invisible hand". Nobody tells the farmers how many tomatoes to grow or the shops what price to set. Despite this, the market usually finds a balance by itself. Of course, governments sometimes step in, for example when prices for bread or petrol rise too fast. But economists still argue about whether this helps or creates new problems.`,

reading:{title:"Can a Café Survive? A Look at the Numbers",text:`Opening a café is a dream for many people. You imagine the smell of coffee, happy customers and a cosy atmosphere. But before you sign a contract, you need to look at a much less romantic thing: the budget.

Let's imagine a small café with twenty seats in a busy area of Astana. Its costs can be divided into two groups. Fixed costs are the same every month, however many customers come. They include rent, salaries, internet, insurance and loan payments. For our café, the rent is 600,000 tenge, the salaries of three baristas are about 900,000 tenge, and other fixed costs are around 300,000 tenge. That makes 1.8 million tenge a month before the café sells a single cup.

Variable costs change with the number of sales: coffee beans, milk, sugar, paper cups and a little electricity for every drink. If one cup of coffee costs 1,500 tenge and its variable costs are 500 tenge, each cup brings 1,000 tenge to cover the fixed costs.

So how many cups does the café need to sell? 1.8 million divided by 1,000 is 1,800 cups a month, or about sixty cups a day. This number is called the break-even point. Below it, the café loses money; above it, the café makes a profit.

Sixty cups a day does not sound like a lot. However, many new cafés have very few customers in the first months, because people simply don't know about them yet. That is why experts say that you should have enough money to cover at least six months of fixed costs. Without this cushion, a few bad weeks can destroy the business.

There are several ways to improve the numbers. The owner can increase the average bill by selling desserts and sandwiches, which have high margins. She can reduce overheads by negotiating the rent or using less energy. Or she can attract more customers in quiet hours, for example with a student discount in the afternoon.

The main lesson is simple. A business does not fail because there is too little love or too few good ideas. It usually fails because there is not enough cash. A clear budget in a simple spreadsheet is not boring paperwork; it is the most important survival tool an entrepreneur has.`,

reading:{title:"From the Silk Road to AliExpress",text:`Two thousand years ago, camel caravans used to travel across the steppes of today's Kazakhstan. They carried silk and porcelain from China to the west and brought back glass, silver and horses. Cities like Otrar and Taraz grew rich because merchants would stop there to rest, trade and pay taxes. The Silk Road was one of the first examples of globalisation: goods, ideas, religions and even diseases travelled thousands of kilometres.

For centuries, international trade used to be slow, expensive and dangerous. A journey from China to Europe could take a year. Only luxury products were worth the effort, so ordinary people used to buy almost everything locally. Your great-grandparents probably wore clothes that were made in their own region and ate food that was grown nearby.

Everything changed in the second half of the twentieth century. The shipping container, invented in the 1950s, made transport much cheaper. Later, the internet connected buyers and sellers all over the world. Many countries reduced tariffs and signed trade agreements. Multinational companies began to move production to countries where labour was cheaper, a practice known as outsourcing.

Today, globalisation is part of our daily life. A Kazakh student orders headphones from China on AliExpress, drinks coffee from Brazil, wears jeans made in Bangladesh and watches a Korean series on an American platform. Kazakhstan itself exports oil, uranium and grain and imports cars, electronics and medicine. Thanks to new railways and logistics centres such as Khorgos on the Chinese border, the country is once again becoming a bridge between East and West, just as it used to be.

However, globalisation has its critics. Some local producers cannot compete with cheap imports and close down. Some countries depend too much on one product or one trading partner. The pandemic showed how fragile global supply chains can be. Many people also worry that local cultures and languages are disappearing.

Our grandparents had to get used to a world that changed very quickly. We are used to buying anything with one click. The question for the next generation is how to enjoy the benefits of global trade while protecting local businesses, the environment and cultural identity.`,

reading:{title:"The Company That Said No to the Future",text:`In 1975, a young engineer at Kodak, Steven Sasson, built the world's first digital camera. It was as big as a toaster, it took twenty-three seconds to record one black-and-white photo, and the images were saved on a cassette. When he showed it to the managers, they were not impressed. Kodak was making huge profits from film, and a camera that did not need film looked like a threat, not an opportunity.

For the next twenty years, Kodak remained one of the most famous brands in the world. It sold most of the film in the United States and employed more than 100,000 people. But digital technology improved quickly. Japanese companies such as Canon and Sony invested heavily in digital cameras, and later smartphones made cameras part of every phone. By the time Kodak seriously entered the digital market, it was too late. In 2012, the company went bankrupt.

Business schools often use Kodak as a lesson. If Kodak had developed the digital camera in the 1980s, it might have become the leader of the new market. If the managers had listened to their own engineer, the company would not have lost its position. Some experts say that Kodak should have been braver and should have accepted lower profits for a few years in order to win the future.

However, the story is a little more complicated. Kodak did not ignore digital technology completely; it even sold digital cameras in the 2000s. The problem was that its whole business model was built on film. Changing it would have meant closing factories and losing a lot of money in the short term. In hindsight, the decision looks obvious, but at the time it was very risky.

The good news is that failure is not always the end. Kodak recovered from bankruptcy as a smaller company that works in printing and chemicals. And many successful entrepreneurs say that their first failures were turning points. They learned what customers really wanted, how to manage money and how to stay calm under pressure.

The lesson for managers is clear: the biggest risk is sometimes not taking a risk. Companies that are afraid of making mistakes often make the biggest mistake of all: they stop changing.`,

  set(k,v){try{localStorage.setItem("be_"+k,JSON.stringify(v))}catch(e){}}
};

document.querySelectorAll(".langsw button").forEach(b=>b.onclick=()=>{if(b.dataset.lang===LANG)return;const y=window.scrollY;setLang(b.dataset.lang);route(true);window.scrollTo(0,y)});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}

/* ---------- audio ---------- */
let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|Google UK English Female|Serena|Kate|Libby|Sonia/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate=0.92,onEnd){
  if(!("speechSynthesis" in window)){toast(U("Бұл браузерде дыбыс жоқ 😔","В этом браузере нет звука 😔"));return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:"en-GB"; if(voice)u.voice=voice; u.rate=rate;
    if(onEnd){u.onend=onEnd;u.onerror=onEnd}
    speechSynthesis.speak(u); return u;
  }catch(e){toast(U("Дыбыс қосылмады","Звук не включился"))}
}

function wireSpeak(t,i){
  const key="used"+i; let used=store.get(key,{});

    $("#usedc").textContent=`${U("Қолданылды","Использовано")}: ${Object.values(used).filter(Boolean).length} / 15 ${Object.values(used).filter(Boolean).length===15?"🏆":""}`};
  document.querySelectorAll("#p-speak .chip input").forEach(inp=>inp.onchange=()=>{used[inp.closest(".chip").dataset.k]=inp.checked;store.set(key,used);upd()});
  $("#rst").onclick=()=>{used={};store.set(key,used);upd()};
  upd();
  $("#rq").onclick=()=>{document.querySelectorAll(".q").forEach(x=>x.classList.remove("hl"));const j=Math.floor(Math.random()*10);const el=$("#q"+j);el.classList.add("hl");el.scrollIntoView({block:"center",behavior:"smooth"});say(t.speaking.q[j])};
  let iv=null,left=60;
  const show=()=>$("#clk").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  $("#tm").onclick=()=>{clearInterval(iv);left=60;show();$("#clk").style.color="";iv=setInterval(()=>{left--;show();if(left<=10)$("#clk").style.color="var(--bad)";if(left<=0){clearInterval(iv);toast(U("⏰ Уақыт бітті!","⏰ Время вышло!"))}},1000)};
}

function readPane(t,i){

    const m=tok.match(/^([^A-Za-z']*)([A-Za-z'’\-]+)([^A-Za-z']*)$/);
    if(!m)return esc(tok);
    return esc(m[1])+`<span class="wd" data-w="${esc(m[2].toLowerCase().replace(/’/g,"'"))}">${esc(m[2])}</span>`+esc(m[3]);
  }).join("")+"</p>").join("");
  const words=r.text.split(/\s+/).length;
  return `<div class="h3">📖 ${esc(r.title)}</div>

    <span>💡 ${U("Білмеген сөзді <b>бас</b>: сары түске боялып, төмендегі тізімге түседі.","<b>Нажми</b> на незнакомое слово: оно станет жёлтым и попадёт в список ниже.")}</span></div>

    <p class="sub">${U("Сөздің аудармасын өзің жаз. Тізім браузеріңде сақталады.","Напиши перевод сам. Список сохраняется в твоём браузере.")}</p>
    <div class="mylist" id="mylist"></div>
    <div style="margin-top:12px"><b>📝 ${U("Конспект / ойларым:","Конспект / мои мысли:")}</b><textarea id="rnote" placeholder="${U("Мәтіннің негізгі ойын 3–4 сөйлеммен ағылшынша жаз...","Напиши главную мысль текста по-английски в 3–4 предложениях...")}"></textarea></div>
  </div>
  <div class="proc" id="proc"><h4>🎬 ${esc(L(r.process.title))}</h4><p class="ps">${U("Мәтіндегі процесс қадамдармен","Процесс из текста по шагам")}</p>
    <div class="steps" id="steps">${r.process.steps.map((s,j)=>(j?`<span class="arrow">➜</span>`:"")+`<div class="step"><span class="sn">STEP ${j+1}</span><span class="se">${s[0]}</span><span class="sl">${esc(s[1])}</span></div>`).join("")}</div>
    <div class="pcap" id="pcap"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn sm" id="replay" style="background:#06b6d4">↻ ${U("Қайта көрсету","Показать снова")}</button></div>
  </div>`;
}
let procTimer=null;
function playProc(){
  clearInterval(procTimer);
  const steps=[...document.querySelectorAll("#steps .step")],arrows=[...document.querySelectorAll("#steps .arrow")];
  if(!steps.length)return;
  const data=T[cur].reading.process.steps;
  steps.forEach(s=>s.classList.remove("in","act"));arrows.forEach(a=>a.classList.remove("in"));
  let k=0;
  const tick=()=>{
    steps.forEach(s=>s.classList.remove("act"));
    const idx=k%steps.length;
    if(k<steps.length){steps[idx].classList.add("in");if(idx>0)arrows[idx-1].classList.add("in")}
    steps[idx].classList.add("act");
    const cap=$("#pcap"); if(cap)cap.textContent=`${idx+1}. ${L(data[idx][2]||data[idx][1])}`;
    k++;
  };
  tick(); procTimer=setInterval(tick,2200);
}
function wireRead(t,i){
  const key="mark"+i; let marks=store.get(key,{});
  const render=()=>{
    document.querySelectorAll("#rtext .wd").forEach(s=>s.classList.toggle("mk",marks[s.dataset.w]!==undefined));
    const ks=Object.keys(marks);
    $("#mcount").textContent=ks.length;
    $("#mylist").innerHTML=ks.length?ks.map(w=>`<div class="myrow"><b>${esc(w)}</b><input data-w="${esc(w)}" value="${esc(marks[w])}" placeholder="${U("аудармасы...","перевод...")}">${spk(w)}<button class="x" data-del="${esc(w)}" title="Өшіру">✕</button></div>`).join(""):`<div class="sub">${U("Әзірге бос. Мәтіндегі сөзді басып көр 👆","Пока пусто. Нажми на слово в тексте 👆")}</div>`;
    document.querySelectorAll("#mylist input").forEach(inp=>inp.oninput=()=>{marks[inp.dataset.w]=inp.value;store.set(key,marks)});
    document.querySelectorAll("#mylist [data-del]").forEach(b=>b.onclick=()=>{delete marks[b.dataset.del];store.set(key,marks);render()});
  };
  $("#rtext").onclick=e=>{const s=e.target.closest(".wd");if(!s)return;const w=s.dataset.w;
    if(marks[w]!==undefined)delete marks[w];else{marks[w]="";say(w,0.85)}store.set(key,marks);render()};
  render();
  const nk="note"+i;$("#rnote").value=store.get(nk,"");$("#rnote").oninput=e=>store.set(nk,e.target.value);
  $("#replay").onclick=playProc;
  let reading=false;
  $("#readAll").onclick=()=>{
    if(reading){reading=false;speechSynthesis.cancel();$("#readAll").textContent=U("🔊 Мәтінді тыңдау","🔊 Слушать текст");document.querySelectorAll(".wd.reading").forEach(x=>x.classList.remove("reading"));return}
    reading=true;$("#readAll").textContent=U("⏹ Тоқтату","⏹ Стоп");
    const ps=[...document.querySelectorAll("#rtext p")];let k=0;
    const next=()=>{document.querySelectorAll(".wd.reading").forEach(x=>x.classList.remove("reading"));
      if(!reading||k>=ps.length){reading=false;$("#readAll").textContent=U("🔊 Мәтінді тыңдау","🔊 Слушать текст");return}
      const p=ps[k++];p.querySelectorAll(".wd").forEach(x=>x.classList.add("reading"));say(p.textContent,0.88,next)};
    next();
  };
}

    ${h.situations.map((s,j)=>`<div class="sit"><div class="st"><span class="tag b-t">${j+1}</span><span style="flex:1">${esc(s)}</span>${spk(s)}</div><textarea data-sit="${j}" placeholder="I would..."></textarea></div>`).join("")}</div>

  <div class="box" id="hw4"><div class="h3" style="font-size:19px">4️⃣ Grammar practice · ${esc(t.grammar.name)}</div>
    <p class="sub">${U("A — дұрыс нұсқаны таңда · B — сөйлем құра · C — қатені тап та түзет","A — выбери верный вариант · B — собери предложение · C — найди и исправь ошибку")}</p>
    ${h.gmcq.map((q,j)=>`<div class="gtask"><span class="lbl2">A · Choose</span><p>${esc(q[0]).replace("___","<u>&nbsp;?&nbsp;&nbsp;&nbsp;</u>")}</p><div class="opts">${q[1].map((o,k)=>`<button class="opt" data-mc="${j}" data-k="${k}">${esc(o)}</button>`).join("")}</div><div class="fb" id="mcf${j}"></div></div>`).join("")}
    ${h.gorder.map((s,j)=>`<div class="gtask" data-ord="${j}"><span class="lbl2">B · Build the sentence</span><p>${U("Сөздерді дұрыс ретпен бас:","Нажимай на слова в правильном порядке:")}</p><div class="built"></div><div class="pool"></div><div class="row" style="margin-top:8px"><button class="btn sm" data-chk>${U("Тексеру","Проверить")}</button><button class="btn ghost sm" data-clr>↺</button></div><div class="fb"></div></div>`).join("")}
    ${h.gfix.map((f,j)=>`<div class="gtask"><span class="lbl2">C · Find the mistake</span><p>❌ ${esc(f[0])}</p><input class="fixin" id="fx${j}" placeholder="${U("Дұрыс сөйлемді жаз...","Напиши правильное предложение...")}"><div class="row" style="margin-top:8px"><button class="btn sm" data-fx="${j}">${U("Тексеру","Проверить")}</button><button class="btn ghost sm" data-ans="${j}">${U("Жауабын көру","Показать ответ")}</button></div><div class="fb" id="fxf${j}"></div></div>`).join("")}
  </div>`;
}
function buildQuiz(t){
  const all=[...t.vocab.a2.map(w=>[...w,"A2"]),...t.vocab.b1.map(w=>[...w,"B1"])];
  const pick=shuffle(all).slice(0,10);
  return pick.map((w,j)=>{
    const others=shuffle(all.filter(x=>x!==w)).slice(0,3);
    const type=j%3; // 0: gap-fill, 1: kz->en, 2: en->kz
    let q,opts,ans;
    const re=new RegExp("\\b"+w[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
    if(type===0 && re.test(w[3])){q=U("Бос орынды толтыр: “","Заполни пропуск: “")+w[3].replace(re,"_____")+"”";opts=[w,...others].map(x=>x[0]);ans=w[0]}
    else if(type===2){q=U(`“${w[0]}” деген не?`,`Что значит “${w[0]}”?`);opts=[w,...others].map(x=>L(x[2]));ans=L(w[2])}
    else{q=U(`Ағылшынша қалай болады: “${L(w[2])}”?`,`Как по-английски: “${L(w[2])}”?`);opts=[w,...others].map(x=>x[0]);ans=w[0]}
    return {q,opts:shuffle(opts),ans};
  });
}
function renderQuiz(t){
  const qs=buildQuiz(t);let right=0,done=0;
  $("#score").style.display="none";
  $("#quiz").innerHTML=qs.map((q,j)=>`<div class="qq"><p>${j+1}. ${esc(q.q)}</p><div class="opts">${q.opts.map(o=>`<button class="opt" data-q="${j}">${esc(o)}</button>`).join("")}</div></div>`).join("");
  document.querySelectorAll("#quiz .opt").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.q,q=qs[j],btns=b.parentNode.querySelectorAll(".opt");
    btns.forEach(x=>{x.disabled=true;if(x.textContent===q.ans)x.classList.add("right")});
    if(b.textContent===q.ans)right++;else b.classList.add("wrong");
    done++;if(done===qs.length){const s=$("#score");s.style.display="block";s.textContent=`${U("Нәтиже","Результат")}: ${right} / ${qs.length} ${right>=9?U("🏆 Керемет!","🏆 Отлично!"):right>=7?U("👍 Жақсы!","👍 Хорошо!"):U("📚 Сөздерді тағы қайтала","📚 Повтори слова ещё раз")}`}
  });
}
function wireHW(t,i){
  document.querySelectorAll(".hwnav a").forEach(a=>a.onclick=e=>{e.preventDefault();$(a.getAttribute("href")).scrollIntoView({behavior:"smooth"})});
  const dk="desc"+i,d=$("#desc");d.value=store.get(dk,"");
  const wc=()=>{const n=d.value.trim()?d.value.trim().split(/\s+/).length:0;$("#wc").textContent=`${n} ${U("сөз · мақсат 80+","слов · цель 80+")} ${n>=80?"✅":""}`};
  d.oninput=()=>{store.set(dk,d.value);wc()};wc();
  document.querySelectorAll("[data-sit]").forEach(ta=>{const k="sit"+i+"_"+ta.dataset.sit;ta.value=store.get(k,"");ta.oninput=()=>store.set(k,ta.value)});
  renderQuiz(t);$("#newq").onclick=()=>renderQuiz(t);
  const h=t.hw;
  document.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.mc,q=h.gmcq[j],btns=b.parentNode.querySelectorAll(".opt");
    btns.forEach(x=>x.classList.remove("wrong"));
    if(+b.dataset.k===q[2]){btns.forEach(x=>x.disabled=true);b.classList.add("right");$("#mcf"+j).className="fb ok";$("#mcf"+j).textContent=U("✅ Дұрыс!","✅ Верно!")}
    else{b.classList.add("wrong");$("#mcf"+j).className="fb no";$("#mcf"+j).textContent=U("❌ Қайта ойлан","❌ Подумай ещё")}
  });
  document.querySelectorAll("[data-ord]").forEach(box=>{
    const target=h.gorder[+box.dataset.ord];const words=target.replace(/[.?!]$/,"").split(" ");
    const end=(target.match(/[.?!]$/)||["."])[0];
    const pool=$(".pool",box),built=$(".built",box),fb=$(".fb",box);
    const reset=()=>{built.innerHTML="";pool.innerHTML="";let sh=shuffle(words);if(sh.join(" ")===words.join(" "))sh=sh.reverse();sh.forEach(w=>{const b=document.createElement("button");b.className="tile";b.textContent=w;pool.appendChild(b)});fb.textContent=""};
    box.onclick=e=>{const tl=e.target.closest(".tile");if(!tl)return;(tl.parentNode===pool?built:pool).appendChild(tl)};
    $("[data-clr]",box).onclick=reset;
    $("[data-chk]",box).onclick=()=>{const s=[...built.children].map(x=>x.textContent).join(" ");
      if(norm(s)===norm(target)){fb.className="fb ok";fb.textContent=U("✅ Дұрыс! ","✅ Верно! ")+target;say(target)}else{fb.className="fb no";fb.textContent=pool.children.length?U("Барлық сөзді қолдан","Используй все слова"):U("❌ Рет дұрыс емес, қайта көр","❌ Порядок неверный, попробуй ещё")}};
    reset();
  });
  document.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{const j=+b.dataset.fx,f=h.gfix[j],v=$("#fx"+j).value,fb=$("#fxf"+j);
    const ok=[f[1],...(f[2]||[])].some(a=>norm(a)===norm(v));fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?U("✅ Дұрыс!","✅ Верно!"):U("❌ Әлі қате бар. Тағы қара.","❌ Ещё есть ошибка. Посмотри снова.")});
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{const j=+b.dataset.ans,fb=$("#fxf"+j);fb.className="fb ok";fb.textContent=U("Жауабы: ","Ответ: ")+h.gfix[j][1]});
}

/* ---------- router ---------- */
function route(keep){
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  clearInterval(procTimer);
  const m=location.hash.match(/^#t(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=T.length)topic(+m[1]-1);else home();
  if(keep&&curTab&&m)showTab(curTab);
}
window.addEventListener("hashchange",()=>route());
setLang(LANG);
route();
</script>
